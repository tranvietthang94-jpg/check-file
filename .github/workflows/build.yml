name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            ffmpeg_asset: 'darwin-arm64'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            ffmpeg_asset: 'darwin-x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            ffmpeg_asset: 'win32-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Bundles ffmpeg/ffprobe into the installer as Tauri sidecars so Media
      # Browser thumbnails/metadata work with no external dependency on the
      # end user's machine. Source: eugeneware/ffmpeg-static (GitHub-hosted,
      # the same static builds behind the widely-used `ffmpeg-static`/
      # `ffprobe-static` npm packages) -- Windows build is GPL (gyan.dev
      # essentials), macOS builds are LGPL-only; both are fine to bundle as a
      # separately-invoked subprocess (no linking), with LICENSE/README
      # fetched alongside for compliance.
      - name: Fetch bundled ffmpeg/ffprobe sidecar binaries
        shell: bash
        env:
          FFMPEG_ASSET: ${{ matrix.ffmpeg_asset }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          ext=""
          if [ "$RUST_TARGET" = "x86_64-pc-windows-msvc" ]; then ext=".exe"; fi
          curl -sL --fail -o "src-tauri/binaries/ffmpeg-${RUST_TARGET}${ext}" "${base}/ffmpeg-${FFMPEG_ASSET}"
          curl -sL --fail -o "src-tauri/binaries/ffprobe-${RUST_TARGET}${ext}" "${base}/ffprobe-${FFMPEG_ASSET}"
          curl -sL --fail -o "src-tauri/binaries/ffmpeg-${FFMPEG_ASSET}.LICENSE" "${base}/${FFMPEG_ASSET}.LICENSE"
          chmod +x "src-tauri/binaries/ffmpeg-${RUST_TARGET}${ext}" "src-tauri/binaries/ffprobe-${RUST_TARGET}${ext}"

      - name: Smoke Finder Quick Actions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          original_home="$HOME"
          smoke_home="$(mktemp -d "$RUNNER_TEMP/offloadkit-finder-home.XXXXXX")"
          mkdir -p "$smoke_home/Library/Services" "$smoke_home/tmp"
          HOME="$smoke_home" TMPDIR="$smoke_home/tmp" CARGO_HOME="${CARGO_HOME:-$original_home/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}" \
            cargo test --manifest-path src-tauri/Cargo.toml --lib \
            finder_integration::tests -- --test-threads=1
          HOME="$smoke_home" TMPDIR="$smoke_home/tmp" CARGO_HOME="${CARGO_HOME:-$original_home/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}" \
            cargo test --manifest-path src-tauri/Cargo.toml --lib \
            explorer_integration::tests::macos_file_url_pasteboard_round_trips_and_rejects_non_file_content \
            -- --exact --test-threads=1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'OffloadKit v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Verify macOS bundle structure
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${RUST_TARGET}/release/bundle"
          app_bundle="$bundle_root/macos/OffloadKit.app"
          test -d "$app_bundle"
          test -x "$app_bundle/Contents/MacOS/offloadkit"
          file "$app_bundle/Contents/MacOS/offloadkit" | grep -F "$([[ "$RUST_TARGET" == aarch64-* ]] && echo arm64 || echo x86_64)"
          find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit | grep -q .
